<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IHF Women's Elo Rankings — National Handball Teams</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1>National Handball Team Elo Rankings</h1>
    <p class="subtitle">Women's — <span id="team-count">0</span> teams rated</p>
    <p class="subtitle">Updated through 2026 EHF Euro Cup</p>
  </header>

  <main>
    <div class="controls">
      <input id="search" type="search" placeholder="Search teams…" autocomplete="off">
      <span id="result-count" class="muted"></span>
    </div>

    <div class="table-wrap">
      <table id="rank-table">
        <thead>
          <tr>
            <th scope="col" class="col-rank">Rank</th>
            <th scope="col">Country</th>
            <th scope="col" class="col-move">Change</th>
            <th scope="col" class="col-elo">Elo</th>
          </tr>
        </thead>
        <tbody id="rank-body"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p class="muted">Women's rankings · Source: ranking.txt</p>
    <p class="muted"><a class="repo-link" href="https://github.com/rofarvar/handball" target="_blank" rel="noopener noreferrer">View source on GitHub</a></p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
